name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check palimpsest/ bench/ tests/

      # The engine must never need a network at test time. The embedder falls
      # back to a deterministic hashing backend when the model2vec weights are
      # absent, and PALIMPSEST_LLM_OFFLINE makes any cache miss return None
      # instead of calling out — so a green CI run is proof the suite spends
      # nothing and depends on no external service.
      - name: Test (fully offline)
        env:
          PALIMPSEST_LLM_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pytest tests/ -q --ignore=tests/test_adapters.py

      - name: Import surface
        run: |
          python -c "
          from palimpsest import Memory, Message, Claim, SQLiteStore
          m = Memory()
          print('import ok', m.stats())
          "

      - name: Quickstart example
        env:
          PALIMPSEST_LLM_OFFLINE: "1"
          HF_HUB_OFFLINE: "1"
        run: python examples/quickstart.py
