name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # conftest defaults HF_HOME into the repo, so pin it at the job level or the
    # warm step and the test step disagree about where the weights live.
    env:
      HF_HOME: ${{ github.workspace }}/data/hf_cache
      PALIMPSEST_LLM_OFFLINE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check palimpsest/ bench/ tests/

      # Fetch the embedding weights once so the similarity-sensitive tests run
      # against the SHIPPED configuration rather than the hashing fallback.
      # This is a free model download, not an API call: PALIMPSEST_LLM_OFFLINE
      # stays set throughout, so a green run is still proof the suite spends
      # no LLM quota and needs no external service at test time.
      - name: Warm the embedder
        run: python -c "from palimpsest.embed import default_embedder as d; print(d().backend)"

      - name: Test
        run: pytest tests/ -q --ignore=tests/test_adapters.py -rs

      - name: Import surface
        run: |
          python -c "
          from palimpsest import Memory, Message, Claim, SQLiteStore
          m = Memory()
          print('import ok', m.stats())
          "

      - name: Quickstart example
        run: python examples/quickstart.py
